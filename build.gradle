plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def e2eEnabled = providers.gradleProperty('playwrightE2E').map { it.toBoolean() }.getOrElse(false)
def e2eRunId = providers.gradleProperty('playwrightRunId').getOrElse('')
if (e2eEnabled && !(e2eRunId ==~ /[A-Za-z0-9_-]{1,80}/)) {
    throw new GradleException('playwrightE2E requires a unique playwrightRunId (letters, numbers, _ or -)')
}
def e2eDirectory = layout.projectDirectory.dir("run/e2e/${e2eRunId}")

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'LatvianDev'
        url = 'https://maven.latvian.dev/releases'
    }
    // KubeJS runtime dependencies (e.g. animated-gif-lib-for-java) are published on JitPack.
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

neoForge {
    version = project.neo_version

    validateAccessTransformers = false
    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            if (e2eEnabled) {
                gameDirectory = e2eDirectory
                systemProperties.put('playwright.e2e', 'true')
                systemProperties.put('playwright.e2e.runId', e2eRunId)
                systemProperties.put('playwright.e2e.exit', 'true')
                programArguments.addAll '--width', '1024', '--height', '768'
            }
        }
        server {
            server()
        }
        data {
            clientData()
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    // Available to compilation and development runs; never bundled into this mod jar.
    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('prepareClientE2E') {
    onlyIf { e2eEnabled }
    doLast {
        def target = e2eDirectory.asFile
        if (new File(target, "saves/PW_E2E_${e2eRunId}").exists()) {
            throw new GradleException('Refusing to reuse an existing E2E world; choose a new playwrightRunId')
        }
        copy {
            from                 'examples/kubejs/client_scripts/playwright_e2e.js',
                'examples/kubejs/client_scripts/playwright_wood_door.js',
                'examples/kubejs/client_scripts/playwright_container_debug.js',
                'examples/kubejs/client_scripts/playwright_gameplay_debug.js',
                'examples/kubejs/client_scripts/playwright_navigation_debug.js'
            into new File(target, 'kubejs/client_scripts')
        }
        def options = new File(target, 'options.txt')
        if (!options.exists()) {
            options.text = 'lang:en_us\nguiScale:2\npauseOnLostFocus:false\nonboardAccessibility:true\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nmaxFps:60\n'
        }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'prepareClientE2E'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
