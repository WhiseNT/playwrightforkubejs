plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def e2eEnabled = providers.gradleProperty('playwrightE2E').map { it.toBoolean() }.getOrElse(false)
def e2eRunId = providers.gradleProperty('playwrightRunId').getOrElse('')
if (e2eEnabled && !(e2eRunId ==~ /[A-Za-z0-9_-]{1,80}/)) {
    throw new GradleException('playwrightE2E requires a unique playwrightRunId (letters, numbers, _ or -)')
}
def e2eDirectory = layout.projectDirectory.dir("run/e2e/${e2eRunId}")

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (e2eEnabled) {
                workingDirectory e2eDirectory.asFile
                property 'playwright.e2e', 'true'
                property 'playwright.e2e.runId', e2eRunId
                property 'playwright.e2e.exit', 'true'
                args '--width', '1024', '--height', '768'
            }
        }

        server {
            args '--nogui'
        }

        gameTestServer {
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'LatvianDev'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Available to Java compilation and Forge development runs, never bundled into this mod jar.
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    runtimeOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    compileOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    compileOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    testImplementation fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('prepareClientE2E') {
    onlyIf { e2eEnabled }
    doLast {
        def target = e2eDirectory.asFile
        if (new File(target, "saves/PW_E2E_${e2eRunId}").exists()) {
            throw new GradleException('Refusing to reuse an existing E2E world; choose a new playwrightRunId')
        }
        copy {
            from                 'examples/kubejs/client_scripts/playwright_e2e.js',
                'examples/kubejs/client_scripts/playwright_wood_door.js',
                'examples/kubejs/client_scripts/playwright_container_debug.js',
                'examples/kubejs/client_scripts/playwright_gameplay_debug.js',
                'examples/kubejs/client_scripts/playwright_navigation_debug.js'
            into new File(target, 'kubejs/client_scripts')
        }
        def options = new File(target, 'options.txt')
        if (!options.exists()) {
            options.text = 'lang:en_us\nguiScale:2\npauseOnLostFocus:false\nonboardAccessibility:true\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nmaxFps:60\n'
        }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'prepareClientE2E'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description       : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
